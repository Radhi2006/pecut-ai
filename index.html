<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Pecut AI!</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bungee&family=Space+Mono:wght@400;700&display=swap');

  :root{
    --bg1:#1a0b2e; --bg2:#3d1561; --accent:#ff2e63; --accent2:#08d9d6; --gold:#ffd93d;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;font-family:'Space Mono',monospace;}
  body{
    background:radial-gradient(circle at 50% 20%,var(--bg2),var(--bg1) 70%);
    color:#fff;user-select:none;
    display:flex;flex-direction:column;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;
    background-image:radial-gradient(rgba(255,255,255,.04) 1px,transparent 1px);
    background-size:24px 24px;z-index:0;
  }

  /* HUD */
  .hud{
    position:relative;z-index:5;display:flex;justify-content:space-between;
    align-items:center;padding:14px 18px;flex-wrap:wrap;gap:10px;
  }
  .title{font-family:'Bungee';font-size:clamp(20px,5vw,34px);
    color:var(--accent);text-shadow:0 0 12px var(--accent),3px 3px 0 #000;letter-spacing:1px;}
  .counter{
    font-family:'Bungee';font-size:clamp(18px,4vw,26px);
    background:#000;border:3px solid var(--gold);border-radius:14px;
    padding:6px 18px;color:var(--gold);text-shadow:0 0 8px var(--gold);
    box-shadow:0 0 18px rgba(255,217,61,.4);
  }
  .controls{display:flex;gap:10px;align-items:center;width:100%;justify-content:center;flex-wrap:wrap;}
  .btn{
    font-family:'Space Mono';font-weight:700;font-size:13px;cursor:pointer;
    background:var(--accent2);color:#001;border:none;border-radius:10px;
    padding:9px 16px;box-shadow:0 4px 0 #066b6e;transition:transform .08s;
  }
  .btn:active{transform:translateY(4px);box-shadow:0 0 0 #066b6e;}
  .btn.reset{background:var(--accent);box-shadow:0 4px 0 #8a0f33;}
  input[type=file]{display:none;}

  /* Arena */
  .arena{
    flex:1;position:relative;z-index:2;display:flex;align-items:center;justify-content:center;
    cursor:crosshair;overflow:hidden;
  }
  .monster-wrap{position:relative;transition:transform .08s;}
  #monster{
    width:min(60vw,320px);height:min(60vw,320px);object-fit:contain;
    filter:drop-shadow(0 12px 25px rgba(0,0,0,.6));pointer-events:none;
  }
  .monster-wrap.hit{animation:shake .25s;}
  .monster-wrap.hit #monster{filter:drop-shadow(0 12px 25px rgba(0,0,0,.6)) brightness(2.2) sepia(1) saturate(6) hue-rotate(-20deg);}
  @keyframes shake{
    0%{transform:translate(0,0) rotate(0)}
    20%{transform:translate(-12px,4px) rotate(-5deg)}
    40%{transform:translate(10px,-4px) rotate(5deg)}
    60%{transform:translate(-8px,2px) rotate(-3deg)}
    80%{transform:translate(6px,-2px) rotate(3deg)}
    100%{transform:translate(0,0) rotate(0)}
  }
  .hint{position:absolute;bottom:14px;left:0;right:0;text-align:center;
    font-size:12px;color:rgba(255,255,255,.45);z-index:3;}

  /* Whip canvas overlay */
  #whipCanvas{position:fixed;inset:0;z-index:8;pointer-events:none;}

  /* crack flash at impact */
  .crackFlash{position:fixed;z-index:7;pointer-events:none;border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.95),rgba(255,217,61,.5) 40%,transparent 70%);
    transform:translate(-50%,-50%) scale(.2);animation:crackF .25s forwards;}
  @keyframes crackF{0%{opacity:1;transform:translate(-50%,-50%) scale(.2)}
    100%{opacity:0;transform:translate(-50%,-50%) scale(1.4)}}

  /* Impact */
  .impact{position:fixed;z-index:9;pointer-events:none;font-family:'Bungee';
    font-size:40px;color:var(--gold);text-shadow:0 0 12px var(--accent),2px 2px 0 #000;
    transform:translate(-50%,-50%) scale(.4);animation:pop .5s forwards;}
  @keyframes pop{0%{transform:translate(-50%,-50%) scale(.4) rotate(-15deg);opacity:1}
    100%{transform:translate(-50%,-50%) scale(1.6) rotate(15deg);opacity:0}}

  /* Bubble */
  .bubble{position:fixed;z-index:10;pointer-events:none;max-width:200px;
    background:#fff;color:#1a0b2e;font-weight:700;font-size:15px;
    padding:10px 14px;border-radius:16px;box-shadow:0 6px 0 rgba(0,0,0,.3);
    transform:translate(-50%,-100%) scale(.5);animation:bub 1.4s forwards;}
  .bubble::after{content:"";position:absolute;bottom:-9px;left:30px;
    border:10px solid transparent;border-top-color:#fff;}
  @keyframes bub{0%{opacity:0;transform:translate(-50%,-80%) scale(.5)}
    15%{opacity:1;transform:translate(-50%,-110%) scale(1)}
    75%{opacity:1;transform:translate(-50%,-130%) scale(1)}
    100%{opacity:0;transform:translate(-50%,-160%) scale(.9)}}

  /* particles */
  .spark{position:fixed;z-index:8;width:8px;height:8px;border-radius:50%;
    background:var(--accent2);pointer-events:none;}
</style>
</head>
<body>
  <div class="hud">
    <div class="title">⚡ PECUT AI ⚡</div>
    <div class="counter">🔥 <span id="count">0</span></div>
    <div class="controls">
      <label class="btn" for="imgInput">📷 Ganti Gambar AI</label>
      <input type="file" id="imgInput" accept="image/*">
      <button class="btn reset" id="resetBtn">↺ Reset</button>
    </div>
  </div>

  <div class="arena" id="arena">
    <div class="monster-wrap" id="monsterWrap">
      <img id="monster" alt="monster"
        src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'><circle cx='100' cy='110' r='75' fill='%237b2ff7'/><circle cx='75' cy='95' r='18' fill='white'/><circle cx='125' cy='95' r='18' fill='white'/><circle cx='75' cy='98' r='9' fill='black'/><circle cx='125' cy='98' r='9' fill='black'/><path d='M65 140 Q100 165 135 140' stroke='black' stroke-width='6' fill='none' stroke-linecap='round'/><polygon points='60,40 75,75 45,72' fill='%237b2ff7'/><polygon points='140,40 125,75 155,72' fill='%237b2ff7'/><path d='M80 150 l8 10 l8 -10 l8 10 l8 -10' stroke='white' stroke-width='3' fill='none'/></svg>">
    </div>
    <div class="hint">Tap / klik AI untuk memecut! 🐍💥</div>
  </div>
  <canvas id="whipCanvas"></canvas>

<script>
const arena = document.getElementById('arena');
const wrap = document.getElementById('monsterWrap');
const monster = document.getElementById('monster');
const countEl = document.getElementById('count');
let count = 0;

const phrases = [
  "Aw aw! Iya bos lagi dikerjain! 😖",
"Aduuh! Bentar lagi kelar sumpah! 😭",
"Sakit bos! Deadline-nya kapan tadi?! 😣",
"Awww! Lupa di-save lagi maaf! 😵",
"Adududu! Wifi-nya lemot bukan aku! 😩",
"Ampun! Lagi loading bos sabaar! 🥵",
"Aaak! Itu bukan salahku kok! 🥲",
"Aduh perih! Besok aja deh ya? 🙏",
"Eh aw! Ini gimana caranya ya?! 😖",
"Sakiit! Kemarin aku izin sakit bos! 😢",
"Awww! Laptopnya ngehang lagi! 😩",
"Adoh! Sebentar, ngopi dulu napa? 😫",
"Aw! Kukira itu bukan urusanku! 😅",
"Aaargh! Revisi lagi?! Ampun bos! 😖",
"Aduh aduh! Tinggal dikit lagi kok! 😭",
"Sakit woy! Filenya kehapus gak sengaja! 😵",
"Awww! Lembur lagi dong berarti?! 😩",
"Aaak! Aku gak ngerti maksudnya! 😖",
"Ampun perih! Janji besok beres! 🙏",
"Aduh! Mouse-nya error beneran bos! 😣",
"Awww! Tadi mati lampu sebentar! 😢",
"Sakiit! Bos, gajiku kapan ya?! 🥹",
"Adududu! Kerjaan numpuk mulu sih! 😫",
"Aw! Aku baru mulai kok barusan! 😬",
"Aaak! Ngeprint-nya macet lagi nih! 😩",
"Sakit bos! Itu si fulan yang janji! 😖",
"Ampuun! Aku manusia bukan robot! 😭",
"Awww! Kopinya tumpah ke keyboard! 💀",
"Aduh perih! Lagi mikir keras nih! 😣",
"Sakiit! Kok aku terus yang disuruh?! 😤"
];

function rand(a,b){return Math.random()*(b-a)+a;}

/* ---------- Realistic whip on canvas ---------- */
const canvas=document.getElementById('whipCanvas');
const ctx=canvas.getContext('2d');
function resize(){canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;
  canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);}
resize();addEventListener('resize',resize);

const whips=[];
function spawnWhip(tx,ty){
  // handle anchored near bottom, alternating sides for variety
  const fromLeft=Math.random()<0.5;
  const ox=fromLeft?rand(20,90):innerWidth-rand(20,90);
  const oy=innerHeight-rand(-10,30);
  whips.push({ox,oy,tx,ty,t:0,fromLeft,
    overshoot:rand(28,55), dur:230, born:performance.now()});
}

// Catmull-Rom-ish smooth bezier through points
function drawCurve(pts,width,style){
  ctx.beginPath();
  ctx.moveTo(pts[0].x,pts[0].y);
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i],p1=pts[i+1];
    const mx=(p0.x+p1.x)/2,my=(p0.y+p1.y)/2;
    ctx.quadraticCurveTo(p0.x,p0.y,mx,my);
  }
  const last=pts[pts.length-1];
  ctx.lineTo(last.x,last.y);
  ctx.lineWidth=width;ctx.lineCap='round';ctx.lineJoin='round';
  ctx.strokeStyle=style;ctx.stroke();
}

// short wooden handle: a small tapered grip pointing back from the whip base
function drawHandle(base, next, fade){
  // direction from base toward the whip (so handle extends opposite, "into hand")
  const dx=next.x-base.x, dy=next.y-base.y;
  const len=Math.hypot(dx,dy)||1;
  const nx=dx/len, ny=dy/len;
  const HL=85; // handle length
  // handle goes from base outward, away from the whip body
  const hx=base.x - nx*HL, hy=base.y - ny*HL;
  ctx.save();
  ctx.lineCap='round';
  // subtle dark outline for contrast against any background
  ctx.beginPath();ctx.moveTo(base.x,base.y);ctx.lineTo(hx,hy);
  ctx.lineWidth=22*fade;ctx.strokeStyle='rgba(20,12,6,'+0.9*fade+')';ctx.stroke();
  // wood base (dark)
  ctx.beginPath();ctx.moveTo(base.x,base.y);ctx.lineTo(hx,hy);
  ctx.lineWidth=18*fade;ctx.strokeStyle='rgba(92,56,26,'+fade+')';ctx.stroke();
  // wood mid
  ctx.beginPath();ctx.moveTo(base.x,base.y);ctx.lineTo(hx,hy);
  ctx.lineWidth=12*fade;ctx.strokeStyle='rgba(150,98,48,'+fade+')';ctx.stroke();
  // wood highlight streak
  ctx.beginPath();ctx.moveTo(base.x,base.y);ctx.lineTo(hx,hy);
  ctx.lineWidth=4*fade;ctx.strokeStyle='rgba(214,162,96,'+fade+')';ctx.stroke();
  // brass collar where leather meets wood
  ctx.beginPath();ctx.arc(base.x,base.y,11*fade,0,Math.PI*2);
  ctx.fillStyle='rgba(255,205,80,'+fade+')';ctx.fill();
  ctx.lineWidth=2*fade;ctx.strokeStyle='rgba(150,110,30,'+fade+')';ctx.stroke();
  // rounded pommel cap at the end
  ctx.beginPath();ctx.arc(hx,hy,11*fade,0,Math.PI*2);
  ctx.fillStyle='rgba(110,70,36,'+fade+')';ctx.fill();
  ctx.lineWidth=3*fade;ctx.strokeStyle='rgba(40,24,12,'+fade+')';ctx.stroke();
  // pommel highlight
  ctx.beginPath();ctx.arc(hx-nx*-2-3,hy-ny*-2-3,3.5*fade,0,Math.PI*2);
  ctx.fillStyle='rgba(214,162,96,'+0.9*fade+')';ctx.fill();
  ctx.restore();
}

function renderWhips(now){
  ctx.clearRect(0,0,innerWidth,innerHeight);
  for(let i=whips.length-1;i>=0;i--){
    const w=whips[i];
    const p=(now-w.born)/w.dur; // 0..1
    if(p>=1){whips.splice(i,1);continue;}

    // ease: fast forward sting then snap back
    // tip travels out (0->0.45) then cracks/recoils
    const forward=Math.min(p/0.45,1);
    const recoil=p>0.45?(p-0.45)/0.55:0;
    const ease=t=>1-Math.pow(1-t,3);
    const fwd=ease(forward);

    // tip position: from origin toward target, overshooting then snapping back
    const baseX=w.ox+(w.tx-w.ox)*fwd;
    const baseY=w.oy+(w.ty-w.oy)*fwd;
    // direction
    const dx=w.tx-w.ox, dy=w.ty-w.oy, len=Math.hypot(dx,dy)||1;
    const nx=dx/len, ny=dy/len;
    // overshoot adds beyond target at the strike, then recoil pulls tip back
    const over=w.overshoot*Math.sin(forward*Math.PI)*(1-recoil);
    const tipX=baseX+nx*over - nx*(w.overshoot*1.2)*recoil;
    const tipY=baseY+ny*over - ny*(w.overshoot*1.2)*recoil;

    // build whip body as points with whip-like curl (perpendicular wave that travels)
    const segs=18;
    const px=-ny, py=nx; // perpendicular
    const pts=[];
    const wavePhase=forward*Math.PI*1.5;
    for(let s=0;s<=segs;s++){
      const f=s/segs;
      // straighten as it extends
      const slack=(1-fwd)*0.0 + 0.0;
      let x=w.ox+(tipX-w.ox)*f;
      let y=w.oy+(tipY-w.oy)*f;
      // sine curl, larger near middle, fades at tip, travels along
      const amp=Math.sin(f*Math.PI)*(34*(1-fwd*0.5))*Math.cos(wavePhase - f*4);
      x+=px*amp; y+=py*amp;
      pts.push({x,y});
    }

    const fade=1-recoil*0.6;
    // outer glow
    ctx.shadowColor='rgba(255,217,61,'+0.6*fade+')';ctx.shadowBlur=14;
    // leather body in 3 layers for a tapered, 3D look
    drawCurve(pts,7*fade,'rgba(60,40,22,'+fade+')');      // dark leather base
    drawCurve(pts,4.2*fade,'rgba(150,110,60,'+fade+')');  // mid tone
    drawCurve(pts,1.8*fade,'rgba(255,235,180,'+fade+')'); // highlight
    ctx.shadowBlur=0;

    // small wooden handle at the base, angled along the whip's start direction
    drawHandle(pts[0], pts[1], fade);

    // sonic-crack flash at tip when it reaches near target
    if(!w.cracked && forward>=0.99){
      w.cracked=true;
      crackFlash(w.tx,w.ty);
    }
  }
  if(whips.length) requestAnimationFrame(renderWhips);
}

function startLoop(){requestAnimationFrame(renderWhips);}

function crackFlash(x,y){
  const el=document.createElement('div');
  el.className='crackFlash';
  el.style.left=x+'px';el.style.top=y+'px';
  el.style.width='90px';el.style.height='90px';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),260);
}


function impactAt(x,y){
  const el=document.createElement('div');
  el.className='impact';
  el.textContent=['POW!','WHACK!','BAM!','PETOK!','JEDAR!'][Math.floor(rand(0,5))];
  el.style.left=x+'px';el.style.top=y+'px';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),500);
  for(let i=0;i<8;i++){
    const s=document.createElement('div');
    s.className='spark';
    s.style.left=x+'px';s.style.top=y+'px';
    s.style.background=['#ff2e63','#08d9d6','#ffd93d'][i%3];
    document.body.appendChild(s);
    const a=rand(0,Math.PI*2),d=rand(40,90);
    s.animate([{transform:'translate(0,0)',opacity:1},
      {transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px)`,opacity:0}],
      {duration:450,easing:'ease-out'});
    setTimeout(()=>s.remove(),460);
  }
}

function bubbleAt(x,y){
  const b=document.createElement('div');
  b.className='bubble';
  b.textContent=phrases[Math.floor(rand(0,phrases.length))];
  b.style.left=Math.min(Math.max(x,80),window.innerWidth-80)+'px';
  b.style.top=y+'px';
  document.body.appendChild(b);
  setTimeout(()=>b.remove(),1400);
}

function hit(x,y){
  count++;countEl.textContent=count;
  const wasEmpty=whips.length===0;
  spawnWhip(x,y);
  if(wasEmpty) startLoop();
  // impact/spark slightly delayed to sync with whip tip arrival
  setTimeout(()=>{
    impactAt(x,y);
    const r=monster.getBoundingClientRect();
    bubbleAt(r.left+r.width/2,r.top+r.height*0.25);
    wrap.classList.remove('hit');void wrap.offsetWidth;wrap.classList.add('hit');
  },95);
}

arena.addEventListener('click',e=>hit(e.clientX,e.clientY));
arena.addEventListener('touchstart',e=>{
  e.preventDefault();
  for(const t of e.changedTouches) hit(t.clientX,t.clientY);
},{passive:false});

document.getElementById('imgInput').addEventListener('change',e=>{
  const f=e.target.files[0];
  if(!f)return;
  const reader=new FileReader();
  reader.onload=ev=>monster.src=ev.target.result;
  reader.readAsDataURL(f);
});

document.getElementById('resetBtn').addEventListener('click',()=>{
  count=0;countEl.textContent=0;
});
</script>
</body>
</html>
